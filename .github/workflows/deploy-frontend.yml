name: Deploy React Frontend to AWS

on:
  push:
    branches:
      - development # Change this if you are working on a different branch!

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    # 1. GitHub downloads your React code
    - name: Checkout Code
      uses: actions/checkout@v3

    # 2. GitHub sets up Node.js to run React
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18' 

    # 3. GitHub installs your packages and builds the optimized 'dist' folder
    - name: Install and Build
      run: |
        npm install
        npm run build

    # 4. GitHub logs in and clears out your old website files to prevent mixing
    - name: Clear old frontend files
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.AWS_HOST }}
        username: ${{ secrets.AWS_USERNAME }}
        key: ${{ secrets.AWS_PRIVATE_KEY }}
        script: |
          sudo rm -rf /var/www/smartbiz-frontend/*

    # 5. GitHub securely copies the new 'dist' folder contents to your Nginx folder
    - name: Copy new files to AWS
      uses: appleboy/scp-action@master
      with:
        host: ${{ secrets.AWS_HOST }}
        username: ${{ secrets.AWS_USERNAME }}
        key: ${{ secrets.AWS_PRIVATE_KEY }}
        source: "dist/"
        target: "/var/www/smartbiz-frontend/"
        strip_components: 1